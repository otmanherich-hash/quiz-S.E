<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Résultats</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="container wide"><div class="card"><div class="topline"><h1>📊 Résultats</h1><div><a class="button" href="{{ url_for('export_csv') }}">CSV</a> <a class="button secondary" href="{{ url_for('admin_logout') }}">Déconnexion</a></div></div>{% if results %}<div class="table-wrap"><table><thead><tr><th>#</th><th>Nom</th><th>Score</th><th>%</th><th>Date</th></tr></thead><tbody>{% for r in results %}<tr><td>{{ r["id"] }}</td><td>{{ r["name"] }}</td><td>{{ r["score"] }}/{{ r["total"] }}</td><td>{{ r["percentage"] }}%</td><td>{{ r["created_at"] }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<p>Aucun résultat.</p>{% endif %}</div></div></body></html>
